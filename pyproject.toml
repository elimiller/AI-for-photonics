[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "surrogate-model"
version = "0.1.0"
description = "A universal function approximator surrogate model using PyTorch, custom initialization, and autograd."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.0.0", # Useful if you want to run Jupyter Notebooks inside VS Code
]
